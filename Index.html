<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML共有ツール</title>
    <!-- Tailwind CSS (デザイン用) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div id="app" class="w-full max-w-2xl bg-white rounded-xl shadow-md p-6">
        <div class="text-center py-10 text-gray-500">読み込み中...</div>
    </div>

    <!-- Firebase SDK (モジュール版 v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // ▼ ここにあなたのFirebase設定を貼り付けてください
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyD6OJINU59GDt3iXM48runxWBR-kHvz7MI", authDomain: "video-tsuwa.firebaseapp.com", databaseURL: "https://video-tsuwa-default-rtdb.firebaseio.com", projectId: "video-tsuwa", storageBucket: "video-tsuwa.firebasestorage.app", messagingSenderId: "595981788032", appId: "1:595981788032:web:319e20bd30142af82e5765"
        };

        // Firebaseの初期化
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ランダムなIDを生成する関数 (8文字)
        function generateId(length = 8) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('id');
        const appDiv = document.getElementById('app');

        if (docId) {
            // ==========================================
            // 【閲覧モード】 ?id=xxxx が指定されている場合
            // ==========================================
            async function fetchHtml() {
                try {
                    const docRef = doc(db, "html_pages", docId);
                    const docSnap = await getDoc(docRef);

                    if (docSnap.exists()) {
                        const htmlContent = docSnap.data().content;
                        // 取得したHTMLをそのまま描画して表示
                        document.open();
                        document.write(htmlContent);
                        document.close();
                    } else {
                        appDiv.innerHTML = `
                            <h1 class="text-xl font-bold text-red-500 mb-2">ページが見つかりません</h1>
                            <p class="text-gray-600 mb-4">指定されたIDのページは存在しないか、削除された可能性があります。</p>
                            <a href="./" class="text-blue-600 underline font-medium">トップに戻る</a>
                        `;
                    }
                } catch (e) {
                    console.error(e);
                    appDiv.innerHTML = `
                        <h1 class="text-xl font-bold text-red-500 mb-2">エラーが発生しました</h1>
                        <p class="text-gray-600">データの読み込みに失敗しました。</p>
                    `;
                }
            }
            fetchHtml();

        } else {
            // ==========================================
            // 【作成モード】 URLにIDがない場合
            // ==========================================
            appDiv.innerHTML = `
                <h1 class="text-2xl font-bold mb-2 text-gray-800">HTML共有ツール</h1>
                <p class="text-sm text-gray-600 mb-4">HTMLコードを入力してアップロードすると、誰でも閲覧できる専用URLが発行されます。</p>
                
                <textarea id="htmlInput" rows="12" class="w-full p-3 border rounded-lg font-mono text-sm mb-4 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="&lt;!DOCTYPE html&gt;&#10;&lt;html&gt;&#10;&lt;head&gt;&lt;title&gt;マイページ&lt;/title&gt;&lt;/head&gt;&#10;&lt;body&gt;&#10;  &lt;h1&gt;こんにちは！&lt;/h1&gt;&#10;&lt;/body&gt;&#10;&lt;/html&gt;"></textarea>
                
                <button id="uploadBtn" class="w-full bg-blue-600 text-white font-semibold py-2.5 px-4 rounded-lg hover:bg-blue-700 transition">アップロードしてURLを発行</button>
                
                <div id="resultArea" class="mt-6 hidden">
                    <p class="text-sm font-semibold text-gray-700 mb-1">共有用URL:</p>
                    <div class="flex gap-2">
                        <input type="text" id="shareUrl" readonly class="w-full p-2 border rounded bg-gray-100 text-sm select-all">
                        <button id="copyBtn" class="bg-gray-200 px-4 py-2 rounded text-sm font-medium hover:bg-gray-300 transition">コピー</button>
                    </div>
                </div>
            `;

            document.getElementById('uploadBtn').addEventListener('click', async () => {
                const htmlContent = document.getElementById('htmlInput').value;
                if (!htmlContent.trim()) {
                    alert('HTMLコードを入力してください。');
                    return;
                }

                const btn = document.getElementById('uploadBtn');
                btn.disabled = true;
                btn.textContent = 'アップロード中...';

                try {
                    const newId = generateId(8);
                    
                    // Firestoreの "html_pages" コレクションに保存
                    await setDoc(doc(db, "html_pages", newId), {
                        content: htmlContent,
                        createdAt: new Date().toISOString()
                    });

                    // 現在のページURLベースに ?id=ID を付与
                    const currentBaseUrl = window.location.origin + window.location.pathname.replace(/\/$/, "");
                    const shareUrl = `${currentBaseUrl}/?id=${newId}`;

                    document.getElementById('shareUrl').value = shareUrl;
                    document.getElementById('resultArea').classList.remove('hidden');
                    btn.textContent = 'アップロード完了！';
                } catch (e) {
                    console.error(e);
                    alert('アップロードに失敗しました。コンソールを確認してください。');
                    btn.disabled = false;
                    btn.textContent = 'アップロードしてURLを発行';
                }
            });

            // コピーボタンの処理
            document.addEventListener('click', (e) => {
                if (e.target && e.target.id === 'copyBtn') {
                    const copyInput = document.getElementById('shareUrl');
                    copyInput.select();
                    navigator.clipboard.writeText(copyInput.value);
                    e.target.textContent = 'コピー完了！';
                    setTimeout(() => { e.target.textContent = 'コピー'; }, 2000);
                }
            });
        }
    </script>
</body>
</html>
