        // 現在の言語を取得（保存された設定またはデフォルト日本語）
        let currentLang = localStorage.getItem('docdrop_lang') || 'ja';
        const langSelector = document.getElementById('langSelector');
        langSelector.value = currentLang;

        function t(key) {
            return translations[currentLang][key] || translations['ja'][key] || key;
        }

        // ==========================================
        // アプリケーションの状態保持変数
        // ==========================================
        let globalDocId = null;
        let globalHtmlContent = "";
        let globalPassword = "";
        let isCreateMode = false;

        function generateId(length = 8) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        let docId = null;
        if (pathSegments.length > 1) {
            docId = pathSegments[pathSegments.length - 1];
        } else if (pathSegments.length === 1 && pathSegments[0].length === 8) {
            docId = pathSegments[0];
        }

        const appDiv = document.getElementById('app');
        document.getElementById('loadingText').textContent = t('loading');

        // 画面を再描画する関数
        function renderUI() {
            if (docId && !isCreateMode) {
                // 閲覧モード中
                renderPreviewOrPassword();
            } else {
                // 作成モード中
                renderCreateMode();
            }
        }

        function renderPreviewOrPassword() {
            if (globalPassword) {
                appDiv.innerHTML = `
                    <div class="text-center py-12 max-w-md mx-auto">
                        <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-xl shadow-inner border border-blue-100">🔒</div>
                        <h2 class="text-xl font-bold text-gray-800 mb-1">${t('pwdRequiredTitle')}</h2>
                        <p class="text-xs text-gray-500 mb-6">${t('pwdRequiredDesc')}</p>
                        
                        <input type="password" id="accessPassword" placeholder="${t('pwdInputPlaceholder')}" class="w-full p-3 border border-gray-300 rounded-xl text-sm mb-3 focus:ring-2 focus:ring-blue-500 focus:outline-none text-center shadow-inner bg-gray-50/50">
                        <button id="authBtn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold py-3 rounded-xl text-sm hover:opacity-95 transition shadow-sm">${t('unlockBtn')}</button>
                        <p id="errorMsg" class="text-xs text-red-500 mt-2.5 hidden font-medium">${t('pwdError')}</p>
                    </div>
                `;

                const handleAuth = () => {
                    const inputVal = document.getElementById('accessPassword').value;
                    if (inputVal === globalPassword) {
                        renderIframe(globalHtmlContent, docId);
                    } else {
                        document.getElementById('errorMsg').classList.remove('hidden');
                    }
                };

                document.getElementById('authBtn').addEventListener('click', handleAuth);
                document.getElementById('accessPassword').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') handleAuth();
                });
            } else {
                renderIframe(globalHtmlContent, docId);
            }
        }

        function renderIframe(htmlContent, currentDocId) {
            appDiv.innerHTML = `
                <div class="flex items-center justify-between mb-4">
                    <span class="text-xs font-semibold text-gray-500 bg-gray-100 px-3 py-1 rounded-full">${t('previewMode')} (ID: ${currentDocId})</span>
                    <a href="./" class="text-xs font-semibold text-blue-600 hover:underline">${t('createNew')}</a>
                </div>
                <div class="w-full h-[70vh] border border-gray-300 rounded-xl overflow-hidden bg-white shadow-inner">
                    <iframe id="previewFrame" class="w-full h-full border-0"></iframe>
                </div>
            `;
            const iframe = document.getElementById('previewFrame');
            iframe.srcdoc = htmlContent;
        }

        function renderCreateMode() {
            appDiv.innerHTML = `
                <div class="mb-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-1">${t('descTitle')}</h2>
                    <p class="text-sm text-gray-500">${t('descText')}</p>
