<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocDrop - HTML共有ツール</title>
    <!-- Tailwind CSS (デザイン用) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div id="app" class="w-full max-w-2xl bg-white rounded-xl shadow-md p-6">
        <!-- 読み込み中の画面 -->
        <div class="text-center py-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent mb-3"></div>
            <p class="text-sm text-gray-500 mb-6">読み込み中...</p>
            <div class="flex items-center justify-center gap-2">
                <span class="text-xs text-gray-400 tracking-wider">POWERED BY</span>
                <!-- SVGロゴ -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 36" class="h-6">
                    <defs>
                        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#2563eb" />
                            <stop offset="100%" stop-color="#4f46e5" />
                        </linearGradient>
                    </defs>
                    <g transform="translate(2, 2)">
                        <path d="M5 2h12l5 5v23a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="url(#logoGrad)" />
                        <path d="M17 2l5 5h-3a2 2 0 0 1-2-2V2z" fill="#93c5fd" opacity="0.6" />
                        <path d="M11 15c-1.8 2.2-2.5 3.5-2.5 4.5a2.5 2.5 0 0 0 5 0c0-1-.7-2.3-2.5-4.5z" fill="#ffffff" />
                    </g>
                    <text x="34" y="25" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="19" fill="url(#logoGrad)" letter-spacing="-0.5">DocDrop</text>
                </svg>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (モジュール版 v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // ▼ ここにあなたのFirebase設定を貼り付けてください
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyD6OJINU59GDt3iXM48runxWBR-kHvz7MI",
    authDomain: "video-tsuwa.firebaseapp.com",
    databaseURL: "https://video-tsuwa-default-rtdb.firebaseio.com",
    projectId: "video-tsuwa",
    storageBucket: "video-tsuwa.firebasestorage.app",
    messagingSenderId: "595981788032",
    appId: "1:595981788032:web:319e20bd30142af82e5765"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 共通のSVGロゴテンプレート
        const svgLogoHtml = `
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 36" class="h-7 inline-block align-middle">
                <defs>
                    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#2563eb" />
                        <stop offset="100%" stop-color="#4f46e5" />
                    </linearGradient>
                </defs>
                <g transform="translate(2, 2)">
                    <path d="M5 2h12l5 5v23a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="url(#logoGrad)" />
                    <path d="M17 2l5 5h-3a2 2 0 0 1-2-2V2z" fill="#93c5fd" opacity="0.6" />
                    <path d="M11 15c-1.8 2.2-2.5 3.5-2.5 4.5a2.5 2.5 0 0 0 5 0c0-1-.7-2.3-2.5-4.5z" fill="#ffffff" />
                </g>
                <text x="34" y="25" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="19" fill="url(#logoGrad)" letter-spacing="-0.5">DocDrop</text>
            </svg>
        `;

        function generateId(length = 8) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        let docId = null;
        if (pathSegments.length > 1) {
            docId = pathSegments[pathSegments.length - 1];
        } else if (pathSegments.length === 1 && pathSegments[0].length === 8) {
            docId = pathSegments[0];
        }

        const appDiv = document.getElementById('app');

        if (docId) {
            // ==========================================
            // 【閲覧モード】 /ID が指定されている場合
            // ==========================================
            async function fetchHtml() {
                try {
                    const docRef = doc(db, "html_pages", docId);
                    const docSnap = await getDoc(docRef);

                    if (docSnap.exists()) {
                        const htmlContent = docSnap.data().content;
                        document.open();
                        document.write(htmlContent);
                        document.close();
                    } else {
                        appDiv.innerHTML = `
                            <div class="text-center py-6">
                                <h1 class="text-xl font-bold text-red-500 mb-2">ページが見つかりません</h1>
                                <p class="text-gray-600 mb-4 text-sm">指定されたIDのページは存在しないか、削除された可能性があります。</p>
                                <a href="./" class="text-blue-600 underline font-medium text-sm">トップに戻る</a>
                                <div class="mt-8 flex items-center justify-center gap-2">
                                    <span class="text-xs text-gray-400">POWERED BY</span>
                                    ${svgLogoHtml}
                                </div>
                            </div>
                        `;
                    }
                } catch (e) {
                    console.error(e);
                    appDiv.innerHTML = `
                        <div class="text-center py-6">
                            <h1 class="text-xl font-bold text-red-500 mb-2">エラーが発生しました</h1>
                            <p class="text-gray-600 text-sm">データの読み込みに失敗しました。</p>
                            <div class="mt-8 flex items-center justify-center gap-2">
                                <span class="text-xs text-gray-400">POWERED BY</span>
                                ${svgLogoHtml}
                            </div>
                        </div>
                    `;
                }
            }
            fetchHtml();

        } else {
            // ==========================================
            // 【作成モード】 ルートにアクセスした場合
            // ==========================================
            appDiv.innerHTML = `
                <div class="flex items-center justify-between mb-4">
                    <div>${svgLogoHtml}</div>
                    <span class="text-xs font-semibold px-2.5 py-1 bg-blue-50 text-blue-600 rounded-full">HTML Share Tool</span>
                </div>
                <p class="text-sm text-gray-600 mb-4">HTMLコードを入力してアップロードすると、誰でも閲覧できる専用URL（/ID）が発行されます。</p>
                
                <textarea id="htmlInput" rows="12" class="w-full p-3 border rounded-lg font-mono text-sm mb-4 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="&lt;!DOCTYPE html&gt;&#10;&lt;html&gt;&#10;&lt;head&gt;&lt;title&gt;マイページ&lt;/title&gt;&lt;/head&gt;&#10;&lt;body&gt;&#10;  &lt;h1&gt;こんにちは！&lt;/h1&gt;&#10;&lt;/body&gt;&#10;&lt;/html&gt;"></textarea>
                
                <button id="uploadBtn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold py-2.5 px-4 rounded-lg hover:opacity-90 transition shadow-sm">アップロードしてURLを発行</button>
                
                <div id="resultArea" class="mt-6 hidden">
                    <p class="text-sm font-semibold text-gray-700 mb-1">共有用URL:</p>
                    <div class="flex gap-2">
                        <input type="text" id="shareUrl" readonly class="w-full p-2 border rounded bg-gray-100 text-sm select-all">
                        <button id="copyBtn" class="bg-gray-200 px-4 py-2 rounded text-sm font-medium hover:bg-gray-300 transition">コピー</button>
                    </div>
                </div>

                <!-- フッター部分のロゴ -->
                <div class="mt-8 text-center">
                    <div class="inline-flex items-center gap-2">
                        <span class="text-xs text-gray-400 tracking-wider">POWERED BY</span>
                        ${svgLogoHtml}
                    </div>
                </div>
            `;

            document.getElementById('uploadBtn').addEventListener('click', async () => {
                const htmlContent = document.getElementById('htmlInput').value;
                if (!htmlContent.trim()) {
                    alert('HTMLコードを入力してください。');
                    return;
                }

                const btn = document.getElementById('uploadBtn');
                btn.disabled = true;
                btn.textContent = 'アップロード中...';

                try {
                    const newId = generateId(8);
                    
                    await setDoc(doc(db, "html_pages", newId), {
                        content: htmlContent,
                        createdAt: new Date().toISOString()
                    });

                    const currentBaseUrl = window.location.origin + window.location.pathname.replace(/\/$/, "");
                    const shareUrl = `${currentBaseUrl}/${newId}`;

                    document.getElementById('shareUrl').value = shareUrl;
                    document.getElementById('resultArea').classList.remove('hidden');
                    btn.textContent = 'アップロード完了！';
                } catch (e) {
                    console.error(e);
                    alert('アップロードに失敗しました。');
                    btn.disabled = false;
                    btn.textContent = 'アップロードしてURLを発行';
                }
            });

            document.addEventListener('click', (e) => {
                if (e.target && e.target.id === 'copyBtn') {
                    const copyInput = document.getElementById('shareUrl');
                    copyInput.select();
                    navigator.clipboard.writeText(copyInput.value);
                    e.target.textContent = 'コピー完了！';
                    setTimeout(() => { e.target.textContent = 'コピー'; }, 2000);
                }
            });
        }
    </script>
</body>
</html>
